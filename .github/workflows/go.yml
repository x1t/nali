name: Go
on: [push, pull_request]
jobs:

  test-build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Get dependencies and run test
        run: |
          go mod download
          go test ./...
      - name: Build
        run: go build -v ./...

  release-aur-git:
    name: Release Aur Git
    needs: [test-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: echo "version=$(git describe --long --tags | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g')" >> "$GITHUB_OUTPUT"

      - name: Publish AUR package nali-go-git
        uses: zu1k/aur-publish-action@master
        with:
          package_name: nali-go-git
          commit_username: 'zu1k'
          commit_email: 'i@zu1k.com'
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          new_release: ${{ steps.version.outputs.version }}
