name: Go Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build, for example v0.9.0
        required: true
        type: string
jobs:
  release-binary:
    name: Release Binary
    runs-on: ubuntu-latest
    environment: s3
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Get dependencies and run test
        run: |
          go mod download
          go test ./...

      - name: Build
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          NAME: nali
          BINDIR: bin
        run: |
          mkdir -p "$BINDIR"
          make -j linux-amd64.gz linux-armv8.gz
          make sha256sum

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: bin/*
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          draft: true
          prerelease: true

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: build
          path: bin

      - name: Upload to s3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: sh .github/scripts/upload_s3.sh
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}

  release-aur-bin:
    name: Release Aur bin
    needs: [release-binary]
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish AUR package nali-go-bin
        uses: zu1k/aur-publish-action@master
        with:
          package_name: nali-go-bin
          commit_username: 'zu1k'
          commit_email: 'i@zu1k.com'
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          new_release: ${{ steps.version.outputs.version }}

  release-aur:
    name: Release Aur
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish AUR package nali-go
        uses: zu1k/aur-publish-action@master
        with:
          package_name: nali-go
          commit_username: 'zu1k'
          commit_email: 'i@zu1k.com'
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          new_release: ${{ steps.version.outputs.version }}
